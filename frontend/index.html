<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
    <title>Customer Churn Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>
        <p class="subtitle">Predict whether a customer is likely to leave the service.</p>

        <form id="churnForm">

            <h2>Customer Information</h2>

            <div class="form-grid">

                <div>
                    <label>Gender</label>
                    <select id="gender">
                        <option>Male</option>
                        <option>Female</option>
                    </select>
                </div>

                <div>
                    <label>Senior Citizen</label>
                    <select id="SeniorCitizen">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div>
                    <label>Partner</label>
                    <select id="Partner">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Dependents</label>
                    <select id="Dependents">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Tenure (Months)</label>
                    <input type="number" id="tenure" min="0" max="72" value="12">
                </div>

                <div>
                    <label>Phone Service</label>
                    <select id="PhoneService">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

            </div>

            <h2>Services</h2>

            <div class="form-grid">

                <div>
                    <label>Multiple Lines</label>
                    <select id="MultipleLines">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No phone service</option>
                    </select>
                </div>

                <div>
                    <label>Internet Service</label>
                    <select id="InternetService">
                        <option>DSL</option>
                        <option>Fiber optic</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Online Security</label>
                    <select id="OnlineSecurity">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Online Backup</label>
                    <select id="OnlineBackup">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Device Protection</label>
                    <select id="DeviceProtection">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Tech Support</label>
                    <select id="TechSupport">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Streaming TV</label>
                    <select id="StreamingTV">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

                <div>
                    <label>Streaming Movies</label>
                    <select id="StreamingMovies">
                        <option>No</option>
                        <option>Yes</option>
                        <option>No internet service</option>
                    </select>
                </div>

            </div>

            <h2>Billing Information</h2>

            <div class="form-grid">

                <div>
                    <label>Contract</label>
                    <select id="Contract">
                        <option>Month-to-month</option>
                        <option>One year</option>
                        <option>Two year</option>
                    </select>
                </div>

                <div>
                    <label>Paperless Billing</label>
                    <select id="PaperlessBilling">
                        <option>Yes</option>
                        <option>No</option>
                    </select>
                </div>

                <div>
                    <label>Payment Method</label>
                    <select id="PaymentMethod">
                        <option>Electronic check</option>
                        <option>Mailed check</option>
                        <option>Bank transfer (automatic)</option>
                        <option>Credit card (automatic)</option>
                    </select>
                </div>

                <div>
                    <label>Monthly Charges</label>
                    <input type="number" id="MonthlyCharges" step="0.01" value="80.5">
                </div>

                <div>
                    <label>Total Charges</label>
                    <input type="number" id="TotalCharges" step="0.01" value="966">
                </div>

            </div>

            <button type="submit">Predict Churn</button>

        </form>

        <div id="result" class="result hidden">
            <h2>Customer Churn Probability</h2>
            <div id="probability"></div>
            <p id="prediction"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
